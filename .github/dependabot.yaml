# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # App dependencies (Vite, React, three.js, ...)
  - package-ecosystem: "npm"
    directory: "/hall-eff-thr-vis"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # one PR for routine minor/patch bumps instead of one PR per package
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by .github/workflows/deploy.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
